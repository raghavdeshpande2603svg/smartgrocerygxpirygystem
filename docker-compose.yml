version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: smart-grocery-db
    restart: always
    environment:
      POSTGRES_DB: smart_grocery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: smart-grocery-backend
    depends_on:
      - postgres
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_grocery
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    volumes:
      - ./backend:/workspace

  frontend:
    build:
      context: ./frontend
    container_name: smart-grocery-frontend
    depends_on:
      - backend
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    volumes:
      - ./frontend:/workspace

volumes:
  postgres_data:
